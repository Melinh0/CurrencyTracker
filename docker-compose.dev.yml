version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command: uvicorn currency_tracker.api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/currency_tracker
    volumes:
      - ./currency_tracker:/app/currency_tracker:ro
      - ./config:/app/config:ro
      - ./scripts:/app/scripts:ro
    environment:
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - ENABLE_API_DOCS=true
    ports:
      - "${API_PORT}:8000"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  collector:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command: python -m currency_tracker.collector.scheduler
    volumes:
      - ./currency_tracker:/app/currency_tracker:ro
      - ./config:/app/config:ro
    environment:
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - COLLECTION_INTERVAL_SECONDS=30
    deploy:
      resources:
        limits:
          memory: 1G

  ml-trainer:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command: python -m currency_tracker.ml.training.scheduler
    volumes:
      - ./currency_tracker:/app/currency_tracker:ro
      - ./config:/app/config:ro
      - ml_models:/app/models
    environment:
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - RETRAIN_INTERVAL_HOURS=1
    deploy:
      resources:
        limits:
          memory: 3G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: currency-frontend-dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://api:8000/api/v1
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 1G

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password=''
    volumes:
      - ./currency_tracker:/app/currency_tracker:ro
      - ./config:/app/config:ro
      - ./notebooks:/app/notebooks
    ports:
      - "${JUPYTER_PORT}:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
    profiles:
      - dev-tools

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: currency-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@currencytracker.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    profiles:
      - dev-tools

  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    container_name: currency-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "${REDIS_COMMANDER_PORT}:8081"
    depends_on:
      - redis
    profiles:
      - dev-tools

volumes:
  pgadmin_data: