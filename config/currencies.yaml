  - code: "BRL"
    name: "Real Brasileiro"
    symbol: "R$"
    symbol_native: "R$"
    priority: "base"
    category: "base"
    decimal_places: 4
    is_base: true

# Configurações de coleta
collection:
  interval_seconds: 60
  timeout_seconds: 30
  max_retries: 3
  retry_delay_seconds: 5
  batch_size: 50

# Configurações de validação
validation:
  max_spread_percent: 5.0
  min_rate: 0.0001
  max_rate_change_percent: 50.0
  outlier_detection: true
  outlier_method: "iqr"
  outlier_threshold: 1.5

# Configurações de armazenamento
storage:
  postgres:
    table_prefix: "currency_"
    partition_by_month: true
  influxdb:
    measurement: "exchange_rates"
    retention_policy: "autogen"
    shard_duration: "7d"
  redis:
    key_prefix: "currency:"
    ttl_seconds: 300