  # Outras Moedas Relevantes
  - code: "RUB"
    name: "Rublo Russo"
    symbol: "₽"
    symbol_native: "₽"
    priority: "high"
    category: "emerging"
    decimal_places: 4
    volatility: "high"
    sources:
      - "awesomeapi"
      - "exchangerate"
