# ============================================
# CurrencyTracker - CI/CD Pipeline
# ============================================

name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  POETRY_VERSION: '1.7.1'

jobs:
  # --------------------------------------------
  # Code Quality Checks
  # --------------------------------------------
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff black mypy

      - name: Run Ruff
        run: ruff check currency_tracker tests

      - name: Check Black formatting
        run: black --check currency_tracker tests

      - name: Run MyPy
        run: mypy currency_tracker --ignore-missing-imports

  # --------------------------------------------
  # Security Scan
  # --------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: pip install bandit safety

      - name: Run Bandit
        run: bandit -r currency_tracker -ll -x tests

      - name: Run Safety
        run: safety check -r requirements.txt

  # --------------------------------------------
  # Unit Tests
  # --------------------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: currency_tracker
          POSTGRES_USER: currency_user
          POSTGRES_PASSWORD: currency_pass
        ports: 5432:5432
        options: >-
          --health-cmd "pg_isready -U currency_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Wait for services
        run: |
          sleep 10
          pg_isready -h localhost -p 5432 -U currency_user
          redis-cli -h localhost -p 6379 ping

      - name: Run database migrations
        run: |
          DATABASE_URL=postgresql://currency_user:currency_pass@localhost:5432/currency_tracker \
          alembic upgrade head
        working-directory: ./currency_tracker

      - name: Run tests
        run: |
          pytest tests/unit -v --cov=currency_tracker --cov-report=xml --cov-report=term-missing
        env:
          DATABASE_URL: postgresql://currency_user:currency_pass@localhost:5432/currency_tracker
          REDIS_URL: redis://localhost:6379/0
          INFLUXDB_URL: http://localhost:8086
          INFLUXDB_TOKEN: test-token
          INFLUXDB_ORG: test-org
          INFLUXDB_BUCKET: test-bucket

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests

  # --------------------------------------------
  # Integration Tests
  # --------------------------------------------
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, security, test]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: currency_tracker
          POSTGRES_USER: currency_user
          POSTGRES_PASSWORD: currency_pass
        ports: 5432:5432
        options: >-
          --health-cmd "pg_isready -U currency_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      influxdb:
        image: influxdb:2.7-alpine
        env:
          DOCKER_INFLUXDB_INIT_MODE: setup
          DOCKER_INFLUXDB_INIT_USERNAME: admin
          DOCKER_INFLUXDB_INIT_PASSWORD: adminpassword
          DOCKER_INFLUXDB_INIT_ORG: test-org
          DOCKER_INFLUXDB_INIT_BUCKET: test-bucket
          DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: test-token
        ports: 8086:8086

      redis:
        image: redis:7-alpine
        ports: 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run integration tests
        run: |
          pytest tests/integration -v
        env:
          DATABASE_URL: postgresql://currency_user:currency_pass@localhost:5432/currency_tracker
          REDIS_URL: redis://localhost:6379/0
          INFLUXDB_URL: http://localhost:8086
          INFLUXDB_TOKEN: test-token
          INFLUXDB_ORG: test-org
          INFLUXDB_BUCKET: test-bucket

  # --------------------------------------------
  # Build Docker Images
  # --------------------------------------------
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, security, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/currency-tracker
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Collector
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: collector
          push: true
          tags: ghcr.io/${{ github.repository }}/currency-collector:${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ML Trainer
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: ml-trainer
          push: true
          tags: ghcr.io/${{ github.repository }}/currency-ml-trainer:${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Dashboard
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: dashboard
          push: true
          tags: ghcr.io/${{ github.repository }}/currency-dashboard:${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------
  # Deploy to Staging
  # --------------------------------------------
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: [build, integration-test]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Deploy to staging
        run: |
          echo "Deploy to staging environment"
          # Add your staging deployment commands here
          # e.g., kubectl apply -f k8s/staging/

  # --------------------------------------------
  # Deploy to Production
  # --------------------------------------------
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [build, integration-test]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy to production
        run: |
          echo "Deploy to production environment"
          # Add your production deployment commands here
          # e.g., kubectl apply -f k8s/production/

  # --------------------------------------------
  # Notify
  # --------------------------------------------
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [lint, security, test, build, integration-test, deploy-staging, deploy-production]
    if: always()
    steps:
      - name: Send notification
        if: failure()
        run: |
          echo "Pipeline failed! Check GitHub Actions for details."
          # Add Slack/Discord/Email notification here
